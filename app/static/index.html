<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlas</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 600px; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .chat-box { height: 400px; overflow-y: auto; border: 1px solid #333; padding: 10px; border-radius: 8px; background: #222; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; }
        .msg.user { background: #007bff; align-self: flex-end; border-bottom-right-radius: 0; }
        .msg.atlas { background: #444; align-self: flex-start; border-bottom-left-radius: 0; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #status { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Atlas</h2>
            <span id="status">Verbinde...</span>
        </div>
        <div class="chat-box" id="chat"></div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Nachricht an Atlas..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Senden</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat');
        const status = document.getElementById('status');
        let ws;

        function addMsg(text, type) {
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            ws.onopen = () => { status.textContent = 'Verbunden'; status.style.color = '#4caf50'; };
            ws.onclose = () => { status.textContent = 'Getrennt'; status.style.color = '#f44336'; setTimeout(connect, 3000); };
            ws.onerror = () => { status.textContent = 'Fehler'; status.style.color = 'red'; };
            
            ws.onmessage = (e) => {
                // Simple text relay for now
                if (typeof e.data === 'string' && !e.data.includes('{"jsonrpc"')) {
                     addMsg(e.data, 'atlas');
                }
            };
        }

        function send() {
            const input = document.getElementById('input');
            const text = input.value;
            if (!text || !ws) return;
            addMsg(text, 'user');
            input.value = '';
            ws.send(text);
        }

        connect();
    </script>
</body>
</html>
