<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Atlas</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg: #0e1116;
            --panel: #171c24;
            --border: #242b37;
            --text: #e6e9ef;
            --muted: #8b93a3;
            --accent: #4f8cff;
            --radius: 14px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; }

        /* Setup & Login */
        .auth-page { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 30px; width: 100%; max-width: 400px; max-height: 92vh; overflow-y: auto; }
        .auth-card h1 { text-align: center; margin: 0 0 24px; }
        .auth-card .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.5; }
        .auth-card label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
        .auth-card input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; }
        .auth-card input:focus { border-color: var(--accent); }
        .auth-card button { width: 100%; margin-top: 20px; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
        .auth-card button:hover { background: #3a70d1; }
        .auth-card .section { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 2px; border-top: 1px solid var(--border); padding-top: 14px; }
        .error-msg { color: #e5534b; font-size: 13px; text-align: center; min-height: 16px; margin-top: 10px; }

        /* Chat */
        #app { display: none; flex-direction: column; height: 100dvh; }
        #app.active { display: flex; }
        header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
        header .logo { width: 30px; height: 30px; }
        header h1 { font-size: 17px; margin: 0; font-weight: 600; }
        header .user-tag { font-size: 12px; color: var(--muted); }
        header .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-left: auto; }
        header .status-dot.online { background: #3fb950; }
        header .status-dot.offline { background: #e5534b; }

        #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 84%; padding: 9px 13px; border-radius: var(--radius); font-size: 15px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
        .msg.user { align-self: flex-end; background: #20437f; border-bottom-right-radius: 4px; }
        .msg.assistant { align-self: flex-start; background: #1d232e; border-bottom-left-radius: 4px; }
        .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12.5px; padding: 4px 10px; }
        .msg .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; }

        #composer { display: flex; gap: 8px; padding: 10px; background: var(--panel); border-top: 1px solid var(--border); }
        #composer input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 15px; padding: 10px 14px; outline: none; }
        #composer input:focus { border-color: var(--accent); }
        #composer button { width: 42px; height: 42px; border: none; border-radius: 50%; background: var(--accent); color: #fff; font-size: 17px; cursor: pointer; flex-shrink: 0; }

        #toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #2b3340; color: var(--text); padding: 9px 16px; border-radius: 20px; font-size: 13.5px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); z-index: 20; transition: opacity .25s; }
        #toast.hidden { display: none; }
    </style>
</head>
<body>
    <!-- Auth-Seite (Setup-Wizard oder Login) -->
    <div class="auth-page" id="authPage">
        <div class="auth-card">
            <h1>🏛️ Atlas</h1>
            {% if setup_mode %}
            <p class="hint">Willkommen! Richte Atlas ein:<br>Admin-Zugang + deine Hermes-Instanz.</p>
            <form id="setupForm">
                <div class="section">Admin-Zugang</div>
                <label>Benutzername</label>
                <input type="text" id="s_username" required autocomplete="username" minlength="3">
                <label>Passwort (min. 6 Zeichen)</label>
                <input type="password" id="s_password" required autocomplete="new-password" minlength="6">
                <div class="section">Hermes-Verbindung</div>
                <label>Hermes-URL (z. B. http://10.0.25.60:9119)</label>
                <input type="url" id="s_hermes_url" placeholder="http://10.0.25.60:9119">
                <label>Hermes-Benutzer (Dashboard-Login)</label>
                <input type="text" id="s_hermes_user" autocomplete="username">
                <label>Hermes-Passwort</label>
                <input type="password" id="s_hermes_pass" autocomplete="current-password">
                <button type="submit">Installation starten</button>
            </form>
            {% else %}
            <p class="hint">Melde dich an, um fortzufahren.</p>
            <form id="loginForm">
                <label>Benutzername</label>
                <input type="text" id="username" required autocomplete="username">
                <label>Passwort</label>
                <input type="password" id="password" required autocomplete="current-password">
                <button type="submit">Anmelden</button>
            </form>
            {% endif %}
            <p class="error-msg" id="authError"></p>
        </div>
    </div>

    <!-- Chat -->
    <div id="app">
        <header>
            <img class="logo" src="/static/icon.svg" alt="Atlas">
            <h1>Atlas</h1>
            <span id="userTag" class="user-tag"></span>
            <span id="statusDot" class="status-dot"></span>
        </header>
        <div id="messages"></div>
        <div id="composer">
            <input id="input" type="text" placeholder="Nachricht an Atlas..." autocomplete="off" enterkeyhint="send">
            <button data-action="send">➤</button>
        </div>
    </div>

    <div id="toast" class="hidden"></div>

    <script>
        const $ = id => document.getElementById(id);
        const authPage = $('authPage');
        const app = $('app');
        const statusDot = $('statusDot');
        const messagesDiv = $('messages');
        let ws = null;
        let bubble = null;
        let rpcId = 0;
        let hermesSessionId = null;

        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        function showAuth() {
            authPage.style.display = 'flex';
            app.classList.remove('active');
        }

        function showChat(user) {
            authPage.style.display = 'none';
            app.classList.add('active');
            if (user && user.username) $('userTag').textContent = user.username;
            connectWS();
        }

        // Bestehende Sitzung prüfen
        fetch('/api/session')
            .then(r => r.json())
            .then(data => { if (data.logged_in) showChat(data); else showAuth(); })
            .catch(() => showAuth());

        {% if setup_mode %}
        $('setupForm').onsubmit = async e => {
            e.preventDefault();
            const d = new URLSearchParams();
            d.set('username', $('s_username').value.trim());
            d.set('password', $('s_password').value);
            d.set('hermes_url', $('s_hermes_url').value.trim());
            d.set('hermes_user', $('s_hermes_user').value.trim());
            d.set('hermes_pass', $('s_hermes_pass').value);
            const r = await fetch('/api/setup', { method: 'POST', body: d });
            const j = await r.json().catch(() => ({}));
            if (r.ok) { showChat({ username: $('s_username').value.trim() }); }
            else { $('authError').textContent = j.message || 'Setup fehlgeschlagen'; }
        };
        {% else %}
        $('loginForm').onsubmit = async e => {
            e.preventDefault();
            const d = new URLSearchParams();
            d.set('username', $('username').value.trim());
            d.set('password', $('password').value);
            const r = await fetch('/api/login', { method: 'POST', body: d });
            const j = await r.json().catch(() => ({}));
            if (r.ok) { showChat({ username: $('username').value.trim() }); }
            else { $('authError').textContent = j.message || 'Anmeldung fehlgeschlagen'; }
        };
        {% endif %}

        function addMsg(role, text) {
            const m = document.createElement('div');
            m.className = 'msg ' + role;
            const t = document.createElement('span');
            t.textContent = text;
            m.appendChild(t);
            messagesDiv.appendChild(m);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return m;
        }

        function sendRpc(method, params) {
            rpcId += 1;
            ws.send(JSON.stringify({ jsonrpc: "2.0", id: rpcId, method: method, params: params || {} }));
            return rpcId;
        }

        function connectWS() {
            if (ws) return;
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws`);
            let reconnected = !hermesSessionId;

            ws.onopen = () => {
                statusDot.classList.add('online');
                statusDot.classList.remove('offline');
                if (!hermesSessionId) {
                    sendRpc('session.create', { close_on_disconnect: true, source: 'atlas-app' });
                }
            };
            ws.onclose = () => {
                statusDot.classList.add('offline');
                statusDot.classList.remove('online');
                ws = null;
                setTimeout(connectWS, 3000);
            };
            ws.onerror = () => {};
            ws.onmessage = ev => {
                let frame;
                try { frame = JSON.parse(ev.data); } catch (_) { return; }

                // Antwort auf session.create -> session_id merken
                if (frame.id === 1 && frame.result && frame.result.session_id) {
                    hermesSessionId = frame.result.session_id;
                    addMsg('system', 'Verbunden mit Atlas ✓');
                    return;
                }
                if (frame.error) {
                    showToast('Fehler: ' + (frame.error.message || 'unbekannt'));
                    return;
                }
                if (frame.method !== 'event') return;
                const p = frame.params || {};
                if (p.type === 'message.delta' && p.payload && p.payload.text) {
                    if (!bubble) bubble = addMsg('assistant', '');
                    bubble.querySelector('span').textContent += p.payload.text;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }
                if (p.type === 'message.complete') {
                    if (bubble) {
                        const meta = document.createElement('span');
                        meta.className = 'meta';
                        meta.textContent = '✓ ' + new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                        bubble.appendChild(meta);
                        bubble = null;
                    }
                }
                if (p.type === 'status.update' && p.payload && p.payload.text) {
                    if (!bubble) showToast(p.payload.text);
                }
                if (p.type === 'error' && p.payload && p.payload.message) {
                    showToast('Hermes: ' + p.payload.message);
                }
            };
        }

        function sendMessage(text) {
            if (!text.trim()) return;
            addMsg('user', text);
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMsg('system', 'Fehler: Nicht verbunden');
                return;
            }
            if (!hermesSessionId) {
                addMsg('system', 'Warte auf Verbindung…');
                return;
            }
            sendRpc('prompt.submit', { session_id: hermesSessionId, text: text });
        }

        $('input').addEventListener('keydown', e => {
            if (e.key === 'Enter') { sendMessage($('input').value); $('input').value = ''; }
        });
        document.querySelector('[data-action="send"]').addEventListener('click', () => {
            sendMessage($('input').value);
            $('input').value = '';
        });
    </script>
</body>
</html>
