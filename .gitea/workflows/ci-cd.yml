name: Build and Push Docker Image (Gitea)

# ════════════════════════════════════════════════════════════════════════
# Gitea Actions (Phase 5.5) — Portierung des GitHub-Workflows 1:1.
#   • Push auf main → Versions-Bump v0.0.x + Git-Tag + Build:
#     Tags latest + v0.0.x + Datums-Tag (wie bisher) in die Gitea-Registry.
#   • Ziel-Registry: gitea.meiser.family (eigene Gitea-Instanz, Phase 5.5).
#     Docker Hub wird NICHT mehr angesteuert (Variante B: bis zur Abnahme
#     baut die GitHub-CI parallel weiter — Datei .github/workflows bleibt
#     unangetastet).
# ════════════════════════════════════════════════════════════════════════
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # Job-Token darf den erzeugten Git-Tag zurückschieben

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Job-Container braucht Zugriff auf den Host-Docker (Socket), damit
    # docker/build-push-action den Daemon des Hosts nutzen kann.
    options: --volume /var/run/docker.sock:/var/run/docker.sock
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine next version (v0.0.1, v0.0.2, ...)
      id: version
      run: |
        # Nur den Semver-Kern betrachten (v0.0.1), etwaige -Suffixe ignorieren
        LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
        if [ -z "$LAST" ]; then
          NEXT="v0.0.1"
        else
          BASE="${LAST%%-*}"
          BASE="${BASE#v}"
          IFS='.' read -r MAJ MIN PAT <<< "$BASE"
          PAT=$((PAT + 1))
          NEXT="v$MAJ.$MIN.$PAT"
        fi
        echo "next=$NEXT" >> "$GITHUB_OUTPUT"
        echo "Neue Version: $NEXT"

    - name: Build date
      id: date
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Create and push Git tag
      run: |
        git config user.name "gitea-actions"
        git config user.email "actions@gitea.meiser.family"
        git tag "${{ steps.version.outputs.next }}"
        git push "https://x-access-token:${GITHUB_TOKEN}@gitea.meiser.family/axel/atlas.git" "${{ steps.version.outputs.next }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Gitea Registry
      uses: docker/login-action@v3
      with:
        registry: gitea.meiser.family
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v5
      with:
        push: true
        build-args: |
          APP_VERSION=${{ steps.version.outputs.next }}
          BUILD_DATE=${{ steps.date.outputs.date }}
        tags: |
          gitea.meiser.family/axel/atlas:latest
          gitea.meiser.family/axel/atlas:${{ steps.version.outputs.next }}
          gitea.meiser.family/axel/atlas:${{ steps.date.outputs.date }}

    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
